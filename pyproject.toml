[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logs-asmr"
dynamic = ["version"]
description = "A live log streaming workspace with ambient audio cues"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["logs", "streaming", "pyqt6", "desktop", "cloudwatch", "docker", "kubernetes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyQt6>=6.7",
    "keyring>=25.7",
]

[project.optional-dependencies]
cloudwatch = ["boto3>=1.35"]
docker = ["docker>=7.0"]
kubernetes = ["kubernetes>=28.0"]
gcp = ["google-cloud-logging>=3.8"]
loki = ["websockets>=12.0", "httpx>=0.27"]
all = ["logs-asmr[cloudwatch,docker,kubernetes,gcp,loki]"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pre-commit>=3.0",
    "logs-asmr[all]",
]

[project.scripts]
logs-asmr = "logs_asmr.app:main"

[tool.hatch.version]
path = "src/logs_asmr/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/logs_asmr"]

[tool.hatch.build.targets.wheel]
packages = ["src/logs_asmr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
